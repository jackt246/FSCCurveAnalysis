[project]
name = "fsc-analysis"
version = "0.1.0"
description = "FSC curve typicality analysis for cryo-EM structures"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "seaborn>=0.12",
    "tensorflow>=2.13",
    "tqdm>=4.65",
    "umap-learn>=0.5",
    "emdb",
]

[project.scripts]
fsc-assess = "fsc_analysis.assess:main"
fsc-batch = "fsc_analysis.batch:main"
fsc-batch-anchored = "fsc_analysis.batch_anchored:main"
fsc-download = "fsc_analysis.downloader:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fsc_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
